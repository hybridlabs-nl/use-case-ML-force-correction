[workspace]
name = "use-case-ML-force-correction"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"
jupytext = ">=1.19.6,<2"
pre-commit = ">=4.7.0,<5"
openpyxl = ">=3.1.5,<4"
ipdb = ">=0.13.13,<0.14"
plotly = ">=7.1.0,<8"

[pypi-dependencies]
fowt-ml = { git = "https://github.com/hybridlabs-nl/FOWT-ML.git" }

[tasks]
lab = { cmd = "jupyter lab", cwd = "notebooks" }
sync = "jupytext --sync notebooks/*.ipynb"
