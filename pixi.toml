# local dev environment only; ignored via .git/info/exclude, not part of the public repo
[workspace]
name = "use-case-ML-force-correction"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"

[pypi-dependencies]
fowt-ml = { git = "https://github.com/hybridlabs-nl/FOWT-ML.git" }

[tasks]
lab = { cmd = "jupyter lab", cwd = "notebooks" }
